<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Validation Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    #message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h3>Please input a number between 150 and 300:</h3>

  <input type="text" id="numberInput">
  <button onclick="checkValue()">Submit</button>

  <div id="message"></div>

  <script>
    function checkValue() {
      const value = document.getElementById("numberInput").value;
      const message = document.getElementById("message");

      const num = Number(value);

      if (isNaN(num)) {
        message.textContent = "Please enter a valid number";
      } else if (num < 150) {
        message.textContent = "Value too small";
      } else if (num > 300) {
        message.textContent = "Value too large";
      } else {
        message.textContent = "Input OK";
      }
    }
  </script>

</body>
</html>
