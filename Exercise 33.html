<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Validation Practice</title>
  <style>
    body {
      font-family: Arial;
      margin: 40px;
    }
    #message {
      margin-top: 15px;
      color: black;
    }
  </style>
</head>
<body>

  <p>Please input a number between 150 and 300:</p>

  <input type="text" id="numberInput">
  <button onclick="checkValue()">Submit</button>

  <p id="message"></p>

  <script>
    function checkValue() {
      var value = document.getElementById("numberInput").value;
      var num = Number(value);
      var message = document.getElementById("message");

      if (isNaN(num)) {
        message.innerText = "Please enter a valid number";
      } else if (num < 150) {
        message.innerText = "Value too small";
      } else if (num > 300) {
        message.innerText = "Value too large";
      } else {
        message.innerText = "Input OK";
      }
    }
  </script>

</body>
</html>
