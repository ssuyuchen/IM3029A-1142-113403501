<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>圖片檢視介面示意</title>
  <style>
    :root {
      --panel-bg: #efefef;
      --panel-border: #d8d8d8;
      --header-bg: #f6f6f6;
      --text-main: #2f2f2f;
      --text-muted: #707070;
      --button-border: #2f2f2f;
      --button-bg: #ffffff;
      --detail-green: #8cff8f;
      --detail-row-border: #cfdfff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f3f3;
      font-family: Roboto, Arial, "Noto Sans TC", sans-serif;
      color: var(--text-main);
    }

    .app {
      width: 760px;
      background: #ffffff;
      border: 1px solid #e2e2e2;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 18px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
    }

    .topbar {
      height: 28px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .topbar .title {
      line-height: 1;
    }

    .viewer {
      position: relative;
      padding: 20px 26px 0 20px;
      min-height: 222px;
      background: #f7f7f7;
      border-bottom: 1px solid var(--panel-border);
    }

    .photo-frame {
      width: 450px;
      height: 240px;
      max-width: 100%;
      background: #ead6b6;
      border: 1px solid #dfc8a2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .info-btn {
      height: 22px;
      min-width: 72px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--button-border);
      background: var(--button-bg);
      color: var(--text-main);
      font-size: 13px;
      font-family: Roboto, Arial, "Noto Sans TC", sans-serif;
      line-height: 20px;
      cursor: pointer;
    }

    .info-btn:hover {
      background: #fafafa;
    }

    .info-btn:active {
      transform: translateY(1px);
    }

    .details-wrap {
      display: none;
      padding: 10px 20px 20px;
      background: #efefef;
    }

    .details-wrap.show {
      display: block;
    }

    .details-panel {
      height: 150px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #d9d9d9;
    }

    .detail-row {
      min-height: 28px;
      display: flex;
      align-items: center;
      padding: 6px 10px;
      background: var(--detail-green);
      border-bottom: 1px solid var(--detail-row-border);
      font-size: 13px;
      color: #2f2f2f;
      word-break: break-all;
    }

    .detail-row.label {
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="workspace">
      <div class="topbar">
        <div class="title">預覽</div>
        <button class="info-btn" id="toggleBtn" aria-expanded="false">查看資訊</button>
      </div>
        <div></div>
      </div>

      <div class="viewer">
        <div class="topbar">
        <div class="title">預覽</div>
        <button class="info-btn" id="toggleBtn" aria-expanded="false">查看資訊</button>
      </div>

        <div class="photo-frame">
          <img src="https://picsum.photos/450/240" alt="預覽" />
        </div>
      </div>

      <div class="details-wrap" id="detailsWrap">
        <div class="details-panel">
          <div class="detail-row label">修改日期：2017/10/12</div>
          <div class="detail-row">檔名：測試圖片.jpg</div>
          <div class="detail-row">數量：564.97KB</div>
          <div class="detail-row">路徑：https://designcenter.qnap.com.tw/DesignCenterPM/RD/UI/.../image2PbV/example</div>
          <div class="detail-row">尺寸：450 × 240</div>
          <div class="detail-row">格式：JPG</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('toggleBtn');
    const detailsWrap = document.getElementById('detailsWrap');

    toggleBtn.addEventListener('click', () => {
      const isOpen = detailsWrap.classList.toggle('show');
      toggleBtn.textContent = isOpen ? '收起資訊' : '查看資訊';
      toggleBtn.setAttribute('aria-expanded', String(isOpen));
    });
  </script>
</body>
</html>
