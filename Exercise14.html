<!DOCTYPE html>
<html>
<head>
  <title>SVG Exercise</title>
</head>
<body>

<svg width="300" height="300">

  <!-- 藍色正方形 -->
  <rect x="60" y="60" width="150" height="150"
        fill="blue"
        stroke="black"
        stroke-width="6" />

  <!-- 黃色圓形（壓在右側） -->
  <circle cx="200" cy="140" r="70"
          fill="yellow"
          stroke="red"
          stroke-width="6" />

</svg>

</body>
</html>
