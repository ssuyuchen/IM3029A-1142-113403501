<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17 Sustainable Development Goals - Image Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont/style.css">    <style>
        body {
            font-family: 'LXGW WenKai', serif;
            background-color: #F9F5E7; /* 接近設計圖的背景色 */
            color: #1A1A1A;
        }
        .sdg-card {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            padding: 0.5rem;
            color: white;
            position: relative;
            transition: transform 0.2s;
            cursor: pointer;
            overflow: hidden;
        }
        .sdg-card:hover {
            transform: scale(1.05);
            z-index: 10;
        }
        /* 圖片容器確保圖片填滿方塊 */
        .sdg-image-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sdg-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 或者使用 contain 視您的圖片比例而定 */
        }
        
    </style>
</head>
<body class="p-4 md:p-6 lg:p-8">

    <!-- Header / Logo Area (保留圖片連結) -->
    <div class="mb-5">
        <!-- Logo 圖片連結 -->
        <img src="https://taiwanlii.ccu.edu.tw/var/file/153/1153/img/968/SDGsLOGO.png" class="h-23 md:h-28 object-contain">
    </div>

    <div class="w-full h-px bg-gray-300 mb-5"></div>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto">
        <!-- 標題區域 (改回原本的文字樣式) -->
        <h1 class="text-4xl md:text-5xl font-bold mb-7 text-gray-900">17項永續發展目標</h1>
        
        <p class="text-lg md:text-xl leading-relaxed text-gray-800 mb-8 max-w-5xl">
            聯合國於西元 2015 年通過 2030 永續發展議程，提出 17 項全球邁向永續發展的 核心目標，藉此引領政府、地方政府、企業、公民團體等行動者，在未來 15 年間的決策、投資與行動方向，共同創建「每個國家都實現持久、包容和永續的經濟增長和每個 人都有合宜工作」的世界，一個得以永續的方式進行生產、消費和使用從空氣到土地、 從河流、湖泊和地下水到海洋的各種自然資源的世界。
        </p>

        <!-- SDG Grid (維持放置圖片) -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            
            <!-- Goal 1 -->
            <div class="sdg-card bg-sdg-1" data-title="SDG 1: No Poverty">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-1.png" alt="Goal 1">
                </div>
            </div>

            <!-- Goal 2 -->
            <div class="sdg-card bg-sdg-2" data-title="SDG 2: Zero Hunger">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-2.png" alt="Goal 2">
                </div>
            </div>

            <!-- Goal 3 -->
            <div class="sdg-card bg-sdg-3" data-title="SDG 3: Good Health and Well-being">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-3.png" alt="Goal 3">
                </div>
            </div>

            <!-- Goal 4 -->
            <div class="sdg-card bg-sdg-4" data-title="SDG 4: Quality Education">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-4.png" alt="Goal 4">
                </div>
            </div>

            <!-- Goal 5 -->
            <div class="sdg-card bg-sdg-5" data-title="SDG 5: Gender Equality">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-5.png" alt="Goal 5">
                </div>
            </div>

            <!-- Goal 6 -->
            <div class="sdg-card bg-sdg-6" data-title="SDG 6: Clean Water and Sanitation">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-6.png" alt="Goal 6">
                </div>
            </div>

            <!-- Goal 7 -->
            <div class="sdg-card bg-sdg-7" data-title="SDG 7: Affordable and Clean Energy">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-7.png" alt="Goal 7">
                </div>
            </div>

            <!-- Goal 8 -->
            <div class="sdg-card bg-sdg-8" data-title="SDG 8: Decent Work and Economic Growth">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-8.png" alt="Goal 8">
                </div>
            </div>

            <!-- Goal 9 -->
            <div class="sdg-card bg-sdg-9" data-title="SDG 9: Industry, Innovation and Infrastructure">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-9.png" alt="Goal 9">
                </div>
            </div>

            <!-- Goal 10 -->
            <div class="sdg-card bg-sdg-10" data-title="SDG 10: Reduced Inequalities">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-10.png" alt="Goal 10">
                </div>
            </div>

            <!-- Goal 11 -->
            <div class="sdg-card bg-sdg-11" data-title="SDG 11: Sustainable Cities and Communities">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-11.png" alt="Goal 11">
                </div>
            </div>

            <!-- Goal 12 -->
            <div class="sdg-card bg-sdg-12" data-title="SDG 12: Responsible Consumption and Production">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-12.png" alt="Goal 12">
                </div>
            </div>

            <!-- Goal 13 -->
            <div class="sdg-card bg-sdg-13" data-title="SDG 13: Climate Action">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-13.png" alt="Goal 13">
                </div>
            </div>

            <!-- Goal 14 -->
            <div class="sdg-card bg-sdg-14" data-title="SDG 14: Life Below Water">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-14.png" alt="Goal 14">
                </div>
            </div>

            <!-- Goal 15 -->
            <div class="sdg-card bg-sdg-15" data-title="SDG 15: Life on Land">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-15.png" alt="Goal 15">
                </div>
            </div>

            <!-- Goal 16 -->
            <div class="sdg-card bg-sdg-16" data-title="SDG 16: Peace, Justice and Strong Institutions">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-16.png" alt="Goal 16">
                </div>
            </div>

            <!-- Goal 17 -->
            <div class="sdg-card bg-sdg-17" data-title="SDG 17: Partnerships for the Goals">
                <div class="sdg-image-container">
                    <img src="https://sustainable.thu.edu.tw/wp-content/uploads/2022/09/SDGs-17.png" alt="Goal 17">
                </div>
            </div>

        </div>
    </main>

    <!-- Modal 互動彈窗 -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-lg max-w-sm w-full shadow-2xl text-center">
            <h2 id="modal-title" class="text-2xl font-bold mb-4">SDG Goal</h2>
            <p class="text-gray-600 mb-6">這是該永續目標的詳細資訊內容範例。</p>
            <button onclick="closeModal()" class="bg-gray-800 text-white px-6 py-2 rounded-full hover:bg-black transition">關閉</button>
        </div>
    </div>

    <script>
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        document.querySelectorAll('.sdg-card').forEach(card => {
            card.addEventListener('click', () => {
                const title = card.getAttribute('data-title');
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal').style.display = 'flex';
            });
        });
    </script>
</body>
</html>
