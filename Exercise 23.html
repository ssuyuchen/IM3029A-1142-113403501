<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>預覽資訊</title>
  <style>
    :root {
      --panel-bg: #efefef;
      --panel-border: #d8d8d8;
      --header-bg: #f6f6f6;
      --text-main: #2f2f2f;
      --text-muted: #707070;
      --button-border: #2f2f2f;
      --button-bg: #ffffff;
      --detail-green: #8cff8f;
      --detail-row-border: #cfdfff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f3f3;
      font-family: Roboto, Arial, "Noto Sans TC", sans-serif;
      color: var(--text-main);
    }

    .app {
      width: 760px;
      background: #ffffff;
      border: 1px solid #e2e2e2;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 18px;
    }

    .workspace {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
    }

    .topbar {
      height: 28px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
    }

    .title {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1;
    }

    .info-btn {
      height: 22px;
      min-width: 72px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--button-border);
      background: var(--button-bg);
      color: var(--text-main);
      font-size: 13px;
      font-family: Roboto, Arial, "Noto Sans TC", sans-serif;
      line-height: 20px;
      cursor: pointer;
    }

    .info-btn:hover {
      background: #fafafa;
    }

    .viewer {
      padding: 10px 20px 0;
      background: #efefef;
    }

    .image-stage {
      width: 100%;
      max-width: 676px;
      height: 240px;
      margin: 0 auto;
      padding: 0 18px;
      background: #e8cfa6;
      border: 1px solid #dfc8a2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-frame {
      width: 450px;
      height: 240px;
      background: #ffffff;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .details-wrap {
      max-height: 0;
      overflow: hidden;
      padding: 0 20px;
      background: #efefef;
      transition: max-height 0.35s ease, padding-top 0.35s ease, padding-bottom 0.35s ease;
    }

    .details-wrap.show {
      max-height: 220px;
      padding: 10px 20px 20px;
    }

    .details-panel {
      height: 150px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #d9d9d9;
      transform: translateY(-8px);
      opacity: 0;
      transition: transform 0.28s ease, opacity 0.28s ease;
    }

    .details-wrap.show .details-panel {
      transform: translateY(0);
      opacity: 1;
    }

    .detail-row {
      min-height: 28px;
      display: flex;
      align-items: center;
      padding: 6px 10px;
      background: var(--detail-green);
      border-bottom: 1px solid var(--detail-row-border);
      font-size: 13px;
      color: var(--text-muted);
      word-break: break-all;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .details-panel::-webkit-scrollbar {
      width: 12px;
    }

    .details-panel::-webkit-scrollbar-track {
      background: #f0f0f0;
    }

    .details-panel::-webkit-scrollbar-thumb {
      background: #c2c2c2;
      border-radius: 8px;
      border: 2px solid #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="workspace">
      <div class="topbar">
        <div class="title">預覽</div>
        <button class="info-btn" id="toggleBtn" aria-expanded="false">查看資訊</button>
      </div>

      <div class="viewer">
        <div class="image-stage">
          <div class="photo-frame">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=450&h=240&fit=crop" alt="預覽圖片" />
          </div>
        </div>
      </div>

      <div class="details-wrap" id="detailsWrap">
        <div class="details-panel">
          <div class="detail-row">修改日期：2017/10/12</div>
          <div class="detail-row">檔名：測試圖片.JPG</div>
          <div class="detail-row">大小：446.97KB</div>
          <div class="detail-row">路徑：\\designcenter.qnap.com.tw\\DesignCenterPM\\RD\\...\\example</div>
          <div class="detail-row">尺寸：450 × 240</div>
          <div class="detail-row">格式：JPG</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('toggleBtn');
    const detailsWrap = document.getElementById('detailsWrap');

    toggleBtn.addEventListener('click', () => {
      const isOpen = detailsWrap.classList.toggle('show');
      toggleBtn.textContent = isOpen ? '收起資訊' : '查看資訊';
      toggleBtn.setAttribute('aria-expanded', String(isOpen));
    });
  </script>
</body>
</html>
