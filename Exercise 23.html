<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Button</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

<style>
  .info-btn {
    height: 22px;
    padding: 0 18px;

    font-family: 'Roboto', sans-serif;
    font-size: 13px;
    color: #212121;

    background-color: #ffffff;
    border: 1px solid #212121;
    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
  }
</style>
</head>

<body>

<button class="info-btn">查看資訊</button>

</body>
</html>
