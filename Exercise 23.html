<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Exercise</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Roboto', sans-serif;
  margin: 0;
  padding: 20px;
}

/* 整體左右布局 */
.container {
  display: flex;
  gap: 20px;
}

/* 左側列表 */
.sidebar {
  width: 220px;
  border: 1px solid #e0e0e0;
}

.item {
  padding: 8px 12px;
  font-size: 13px;
  color: #212121;
  border-bottom: 1px solid #eaeaea;
}

.item.active {
  background-color: #e8f5e9;
}

/* 右側內容 */
.content {
  flex: 1;
}

/* 圖片 */
.image-box {
  width: 450px;
  height: 240px;
  background-color: #ddd;
  margin-bottom: 20px;
}

.image-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 按鈕（重點） */
.info-btn {
  height: 22px;
  padding: 0 18px;
  font-size: 13px;
  color: #212121;
  background-color: #ffffff;
  border: 1px solid #212121;
  border-radius: 8px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.info-btn:hover {
  background-color: #f5f5f5;
}
</style>
</head>

<body>

<div class="container">

  <!-- 左邊列表 -->
  <div class="sidebar">
    <div class="item">20170101.png</div>
    <div class="item active">20170102.png</div>
    <div class="item">20170103.png</div>
    <div class="item">20170104.png</div>
    <div class="item">20170105.png</div>
  </div>

  <!-- 右邊內容 -->
  <div class="content">

    <!-- 按鈕 -->
    <button class="info-btn">查看資訊</button>

    <!-- 圖片 -->
    <div class="image-box">
      <img src="https://picsum.photos/450/240" alt="">
    </div>

  </div>

</div>

</body>
</html>
