<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Button Exercise</title>

<!-- Google Font (Roboto) -->
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Roboto', sans-serif;
    padding: 50px;
  }

  .custom-btn {
    height: 22px;
    padding: 0 18px;
    font-size: 13px;
    color: #212121;
    background-color: #ffffff;
    border: 1px solid #212121;
    border-radius: 8px;
    cursor: pointer;
  }

  /* Optional hover effect */
  .custom-btn:hover {
    background-color: #f5f5f5;
  }
</style>
</head>

<body>

<button class="info-btn">查看資訊</button>

</body>
</html>
