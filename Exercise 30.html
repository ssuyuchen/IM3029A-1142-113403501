<!DOCTYPE html>
<html>
<head>
    <title>Exercise</title>
    <style>
        body {
            font-family: Arial;
        }

        .container {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .box {
            width: 150px;
            height: 150px;
            border: 1px solid #999;
            text-align: center;
            padding-top: 20px;
        }

        .text {
            font-size: 24px;
            color: black;
            margin-bottom: 15px;
        }

        .pink {
            color: magenta;
        }

        .label {
            text-align: center;
            color: red;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 左邊：原始 -->
    <div>
        <div class="box">
            <div class="text">Hello</div>
            <button>Button</button>
        </div>
    </div>

    <!-- 中間：Mouse over -->
    <div>
        <div class="label">Mouse over button</div>
        <div class="box">
            <div id="text1" class="text">Hello</div>
            <button 
                onmouseover="over()"
                onmouseout="out()"
            >Button</button>
        </div>
    </div>

    <!-- 右邊：Mouse click -->
    <div>
        <div class="label">Mouse click button</div>
        <div class="box">
            <div id="text2" class="text">Hello</div>
            <button onclick="clickBtn()">Button</button>
        </div>
    </div>

</div>

<script>
    function over() {
        document.getElementById("text1").classList.add("pink");
    }

    function out() {
        document.getElementById("text1").classList.remove("pink");
    }

    function clickBtn() {
        let t = document.getElementById("text2");
        t.innerHTML = "Mouse Click";
        t.classList.add("pink");
    }
</script>

</body>
</html>
