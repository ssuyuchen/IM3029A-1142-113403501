<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Styling</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    display: flex;
    justify-content: center; /* 關鍵 */
    align-items: center;
    gap: 0; /* 確保沒有間距 */
}

/* 左圖 */
.left {
    width: 33%;
    border-radius: 18px;
    object-fit: cover;
}

/* 中間圓形 */
.middle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 15px solid #ccc;
    object-fit: cover;
}

/* 右圖 */
.right {
    width: 33%;
    height: 300px;
}
</style>

</head>

<body>

<div class="container">
    <img src="https://taiwan-water.com/wp-content/uploads/2017/06/e6b395e59c8b-01.jpg" class="left">
    <img src="https://static.wixstatic.com/media/5bfb6f_39aceda91fed409b99bccc866aef62c2.jpg/v1/fill/w_640,h_734,al_b,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/5bfb6f_39aceda91fed409b99bccc866aef62c2.jpg" class="middle">
    <img src="https://taiwan-water.com/wp-content/uploads/2017/06/e6b395e59c8b-01.jpg" class="right">
</div>

</body>
</html>
