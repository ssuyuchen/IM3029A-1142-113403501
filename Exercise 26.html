<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Styling</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 外層容器 */
.container {
    width: 90%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* 左圖 */
.left {
    width: 33%;
    border-radius: 18px;
    object-fit: cover;
}

/* 中間圓形 */
.middle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 15px solid #ccc;
    object-fit: cover;
}

/* 右圖（有變形） */
.right {
    width: 33%;
    height: 300px;
}
</style>

</head>

<body>

<div class="container">
    <!-- 左圖 -->
    <img src="https://taiwan-water.com/wp-content/uploads/2017/06/e6b395e59c8b-01.jpg" class="left">

    <!-- 中間圓形 -->
    <img src="https://m.media-amazon.com/images/I/71R5n2ezOuL.jpg" class="middle">

    <!-- 右圖 -->
    <img src="https://taiwan-water.com/wp-content/uploads/2017/06/e6b395e59c8b-01.jpg" class="right">
</div>

</body>
</html>
