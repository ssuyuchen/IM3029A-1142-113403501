<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Web Page Assignment</title>
    <style>
        body {
            font-family: serif;
            padding: 40px;
        }

        h1 {
              font-size: 36px;
              font-weight: bold;
              border-top: 6px solid black;
              display: inline-block;
              padding-top: 10px;
              text-shadow: 2px 2px red;
        }

        h2 {
              border: 4px solid yellow;
              padding: 10px;
              margin-top: 30px;
              font-size: 28px;
              font-style: italic;
        }

        h3 {
              font-size: 26px;
              text-decoration: underline;
              text-align: right;
              margin-top: 40px;
        }
        
    </style>
</head>
<body>

    <h1>This is heading 1</h1>

    <h2>This is heading 2</h2>

    <h3>This is heading 3</h3>

</body>
</html>
