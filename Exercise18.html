<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Web Page Assignment</title>
    <style>
        body {
            font-family: serif;
            padding: 40px;
        }

        h1 {
            text-decoration: overline;
            text-decoration-thickness: 3px;
            font-size: 50px;
            text-shadow: 2px 2px 0px pink;
            margin-bottom: 10px;
            display: inline-block;
        }

        h2 {
            font-size: 40px;
            font-weight: bold;
            font-style: italic;
            background-color: white;
            border: 2px solid black;
            outline: thick outset yellow;

            width: 95%; 
            display: block;
            box-sizing: border-box; 
            
            margin-bottom: 10px;
            padding: 5px 10px;
        }

        h3 {
            text-align: right;
            text-decoration: underline;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <h1>This is heading 1</h1>

    <h2>This is heading 2</h2>

    <h3>This is heading 3</h3>

</body>
</html>
